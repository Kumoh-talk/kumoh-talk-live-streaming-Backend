worker_processes  auto;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # 송출 시작과 종료는 스프링 서버에 전달
            on_publish http://kumoh-talk-streaming-spring:8080/stream/start;
            on_done    http://kumoh-talk-streaming-spring:8080/stream/stop;
        }

        hls on;
        hls_path /tmp/hls;
        hls_fragment 1;
        hls_playlist_length 6;
    }
}

http {
    server {
        listen 9091;

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept' always;
        }

        location /hls_audio {
            types {
                application/vnd.apple.mpegurl m3u8;
                audio/mpeg ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept' always;
        }

        location /stat {
            rtmp_stat all;
        }
    }
}
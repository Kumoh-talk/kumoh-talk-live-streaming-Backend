spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    show-sql: true

  redis:
    host: redis
    port: 6379
    password: ${REDIS_PASSWORD}

aws:
  s3:
    bucket: ${BUCKET_NAME}
    region: ${BUCKET_REGION}
    credentials:
      accessKey: ${BUCKET_ACCESS_KEY}
      secretKey: ${BUCKET_SECRET_KEY}
  cloudfront:
    domainName: ${CLOUDFRONT_DOMAIN_NAME}
    credentials:
      publicKey: ${CLOUDFRONT_PUBLIC_KEY_ID}
      privateKeyPath: ${CLOUDFRONT_PRIVATE_KEY_FULL_PATH}

jwt:
  secret-key: ${JWT_SECRET_KEY}